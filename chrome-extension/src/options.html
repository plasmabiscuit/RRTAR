<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RRTAR Extension Settings</title>
    <style>
      body {
        margin: 24px;
        max-width: 720px;
        font-family: Arial, sans-serif;
        color: #17212b;
      }

      h1 {
        margin-top: 0;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      input,
      button {
        font: inherit;
        padding: 8px 10px;
      }

      button {
        border: 1px solid #2357a5;
        background: #2357a5;
        color: #fff;
        cursor: pointer;
      }

      #status {
        margin-top: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>RRTAR Extension Settings</h1>
    <div class="field">
      <label for="backend-base-url">Backend Base URL</label>
      <input id="backend-base-url" type="url" placeholder="http://100.117.80.82:8081">
    </div>
    <div class="field">
      <label for="shared-api-key">Shared API Key</label>
      <input id="shared-api-key" type="password" placeholder="Optional for now">
    </div>
    <button id="save-btn" type="button">Save Settings</button>
    <div id="status"></div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
