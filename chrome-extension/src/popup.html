<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RRTAR Automation</title>
    <style>
      @font-face {
        font-family: "RasterForge";
        src: url("../assets/fonts/RasterForgeRegular-JpBgm.ttf") format("truetype");
        font-display: block;
      }

      @font-face {
        font-family: "PixeloidSans";
        src: url("../assets/fonts/PixeloidSans-lxa3y.ttf") format("truetype");
        font-display: block;
      }

      @font-face {
        font-family: "NineteenNinety";
        src: url("../assets/fonts/NineteenNinetySeven-11XB.ttf") format("truetype");
        font-display: block;
      }

      :root {
        color-scheme: light;
        font-family: "PixeloidSans", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        --primary: #582c83;
        --primary-strong: #45236a;
        --primary-deep: #2a133f;
        --accent: #ffd100;
        --success: #1a7f64;
        --success-soft: #e6f5ef;
        --warning: #9a6100;
        --warning-soft: #fff2c8;
        --danger: #b43753;
        --danger-soft: #fcebf0;
        --ink: #221d2c;
        --muted: #6a647a;
        --shadow: 0 8px 0 rgba(88, 44, 131, 0.12), 0 18px 28px rgba(45, 18, 63, 0.16);
        --pixel-button-border-purple: url("../assets/img/button-border-purple.svg");
        --pixel-button-border-slate: url("../assets/img/button-border-slate.svg");
        --pixel-button-border-green: url("../assets/img/button-border-green.svg");
        --pixel-button-border: var(--pixel-button-border-purple);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 392px;
        min-height: 420px;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% -10%, rgba(203, 170, 255, 0.34), transparent 18rem),
          radial-gradient(circle at 18% 18%, rgba(115, 67, 170, 0.2), transparent 18rem),
          radial-gradient(circle at 84% 10%, rgba(84, 42, 135, 0.18), transparent 18rem),
          linear-gradient(180deg, #20132f 0%, #25183a 22%, #1d152a 62%, #150f1d 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 18px 18px;
        opacity: 0.65;
      }

      .popup {
        position: relative;
        z-index: 1;
      }

      .popup-header {
        display: flex;
        align-items: center;
        padding: 0.95rem 1rem 0.9rem;
        color: #fff;
        background:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(135deg, rgba(42, 19, 63, 0.9), rgba(88, 44, 131, 0.84));
        background-size: 18px 18px, 18px 18px, auto;
        border-bottom: 3px solid var(--accent);
        box-shadow: 0 10px 0 rgba(42, 19, 63, 0.18), 0 16px 26px rgba(45, 18, 63, 0.18);
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        min-width: 0;
      }

      .header-badge {
        display: block;
        width: 3.25rem;
        height: 3.25rem;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 2px 0 rgba(34, 15, 52, 0.35));
        flex: 0 0 auto;
      }

      .header-brand-copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.18rem;
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-family: "RasterForge", monospace;
        font-size: 1.32rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 .accent {
        color: var(--accent);
      }

      .sub {
        font-size: 0.7rem;
        line-height: 1.45;
        letter-spacing: 0.055em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .popup-main {
        display: grid;
        gap: 0.8rem;
        padding: 0.95rem;
      }

      .card {
        position: relative;
        overflow: hidden;
        padding: 0.95rem 1rem;
        border: 1px solid rgba(91, 59, 129, 0.48);
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(239, 229, 249, 0.98), rgba(220, 204, 239, 0.98) 48%, rgba(189, 167, 220, 0.99) 100%);
        box-shadow:
          0 0 0 2px rgba(245, 238, 252, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          inset 0 -16px 24px rgba(69, 37, 105, 0.16),
          inset 0 0 0 1px rgba(255, 255, 255, 0.34),
          var(--shadow);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.34), transparent 22%, rgba(123, 81, 177, 0.08) 56%, rgba(88, 44, 131, 0.14) 100%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 2px, rgba(147, 115, 193, 0.06) 2px 14px);
        opacity: 0.9;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.65rem;
      }

      .eyebrow {
        font-family: "NineteenNinety", "PixeloidSans", sans-serif;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary-deep);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        padding: 0.24rem 0.5rem;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 2px solid transparent;
        white-space: nowrap;
      }

      .badge.ok {
        background: var(--success-soft);
        color: var(--success);
        border-color: rgba(18, 122, 99, 0.14);
      }

      .badge.warn {
        background: var(--warning-soft);
        color: var(--warning);
        border-color: rgba(159, 98, 0, 0.14);
      }

      .badge.err {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: rgba(186, 49, 72, 0.14);
      }

      .badge.pend {
        background: #eef1f6;
        color: var(--muted);
        border-color: rgba(102, 112, 133, 0.14);
      }

      .preview {
        min-height: 5.9rem;
        white-space: pre-wrap;
        font-size: 0.76rem;
        line-height: 1.6;
        color: var(--primary-deep);
      }

      .status-card {
        min-height: 3.75rem;
        white-space: pre-wrap;
        font-size: 0.72rem;
        line-height: 1.55;
      }

      .status-card.ok {
        color: var(--success);
      }

      .status-card.warn {
        color: var(--warning);
      }

      .status-card.err {
        color: var(--danger);
      }

      .status-card.pend {
        color: var(--muted);
      }

      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 0.65rem;
        align-items: stretch;
      }

      button {
        font: inherit;
      }

      .btn {
        --button-fill: linear-gradient(180deg, #efe8f8, #d8cde7);
        --pixel-outer-shape: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 2px) 2px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 2px calc(100% - 2px), 0 calc(100% - 4px), 0 4px, 2px 2px);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        border: 4px solid transparent;
        border-image-source: var(--pixel-button-border);
        border-image-slice: 6;
        border-image-width: 4px;
        border-image-repeat: stretch;
        border-radius: 0;
        background: var(--button-fill);
        background-clip: padding-box;
        clip-path: var(--pixel-outer-shape);
        color: var(--primary-deep);
        padding: 0.38rem 0.86rem;
        min-height: 3.1rem;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-family: "PixeloidSans", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.42rem;
        transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -2px 0 rgba(0, 0, 0, 0.12);
      }

      .btn::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        clip-path: var(--pixel-outer-shape);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 42%, rgba(0, 0, 0, 0.12) 100%), repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 2px, transparent 2px 12px);
        opacity: 0.72;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(2px);
      }

      .btn:disabled {
        transform: none;
      }

      .btn-primary {
        --pixel-button-border: var(--pixel-button-border-purple);
        --button-fill: linear-gradient(180deg, #7a49ae, var(--primary) 54%, var(--primary-strong));
        color: #fff;
        box-shadow: 0 4px 0 rgba(42, 19, 63, 0.34), 0 9px 16px rgba(42, 19, 63, 0.18);
        text-shadow: 0 1px 0 rgba(42, 19, 63, 0.42);
      }

      .btn-automate {
        --pixel-button-border: var(--pixel-button-border-purple);
        --button-fill: linear-gradient(180deg, #8f63ba, #7340a7 40%, var(--primary));
        color: #fff;
        padding: 0.5rem 1.18rem;
        min-height: 3.1rem;
        font-size: 0.88rem;
        font-weight: 900;
        box-shadow: 0 4px 0 rgba(42, 19, 63, 0.34), 0 10px 18px rgba(88, 44, 131, 0.22);
        text-shadow: 0 1px 0 rgba(42, 19, 63, 0.42);
      }

      .btn-primary .icon img,
      .btn-automate .icon img,
      .icon-btn .icon img {
        filter: brightness(0) invert(1);
      }

      .btn-disabled {
        --pixel-button-border: var(--pixel-button-border-slate);
        --button-fill: linear-gradient(180deg, #ede9f2, #d7d0e0);
        color: #98a2b3;
        cursor: not-allowed;
        box-shadow: 0 1px 0 rgba(80, 72, 92, 0.18);
        text-shadow: none;
      }

      .icon {
        width: 0.95rem;
        height: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .icon img {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .icon-btn {
        --pixel-button-border: var(--pixel-button-border-slate);
        --button-fill: linear-gradient(180deg, #7c4bb0, var(--primary), var(--primary-strong));
        color: #fff;
        padding: 0.22rem 0.72rem;
        min-height: 3.1rem;
        min-width: 3rem;
        box-shadow: 0 4px 0 rgba(42, 19, 63, 0.28);
        text-shadow: 0 1px 0 rgba(42, 19, 63, 0.38);
      }

      .icon-btn .icon {
        width: 1rem;
        height: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <div class="header-brand">
          <img class="header-badge" src="../assets/img/pixelT.png" alt="R and R TAR badge">
          <div class="header-brand-copy">
            <h1>R&amp;R<span class="accent">TAR</span></h1>
            <span class="sub">R&amp;R Tool-Assisted<br>Re-entry</span>
          </div>
        </div>
      </header>
      <main class="popup-main">
        <section class="card">
          <div class="card-head">
            <span class="eyebrow">Active Form</span>
            <span id="form-chip" class="badge pend">Scanning</span>
          </div>
          <div id="preview" class="preview">Opening popup and checking the active Grants.gov tab...</div>
        </section>
        <section id="status" class="card status-card pend">Idle.</section>
        <div class="action-row">
          <button id="open-dashboard-btn" class="btn btn-primary" type="button">
            <span class="icon"><img src="../assets/icons/PNG/for-light-mode/16px/regular/globe.png" alt=""></span>
            <span>Dashboard</span>
          </button>
          <button id="autofill-btn" class="btn btn-automate" type="button">
            <span class="icon"><img src="../assets/icons/PNG/for-light-mode/16px/regular/play.png" alt=""></span>
            <span>Automate</span>
          </button>
          <button id="options-btn" class="btn icon-btn" type="button" title="Open settings" aria-label="Open settings">
            <span class="icon"><img src="../assets/img/settings.svg" alt=""></span>
          </button>
        </div>
      </main>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
