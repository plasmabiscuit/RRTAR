<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RRTAR Automation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 12px;
        width: 340px;
        background: #f5f7fa;
        color: #17212b;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }

      .row {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .button-row {
        grid-template-columns: 1fr 1fr;
      }

      button {
        font: inherit;
        padding: 8px 10px;
      }

      button {
        border: 1px solid #2357a5;
        background: #2357a5;
        color: #fff;
        cursor: pointer;
      }

      button.secondary {
        border-color: #bcc7d6;
        background: #fff;
        color: #17212b;
      }

      #status {
        min-height: 48px;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.4;
        background: #fff;
        border: 1px solid #d7e0eb;
        padding: 8px;
      }

      #preview {
        min-height: 110px;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.45;
        background: #fff;
        border: 1px solid #d7e0eb;
        padding: 8px;
      }

      .meta {
        font-size: 11px;
        color: #556678;
      }
    </style>
  </head>
  <body>
    <h1>RRTAR Automation</h1>
    <div class="row button-row">
      <button id="detect-btn" class="secondary" type="button">Detect Current Form</button>
      <button id="open-dashboard-btn" class="secondary" type="button">Open Dashboard</button>
      <button id="autofill-btn" type="button">Autofill Current Form</button>
      <button id="options-btn" class="secondary" type="button">Open Settings</button>
    </div>
    <div class="row">
      <div class="meta">Preview</div>
      <div id="preview">Detect a Grants.gov form to load the current dashboard manifest.</div>
    </div>
    <div id="status">Idle.</div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
