<div class="proxy-blcking srch-fvrt-cntry-wrap">
    <div class="head-bar country-header">
        <div class="headbar-logo-wrp">
            <a href="proxy.html" class="backbtn inlineA ripple" data-ripple-color="#d4d3d3"></a>
            <h3>{channelsTxtSelectStream}</h3>
        </div>
    </div>
    <div class="proxy-body padding0">
        <div class="srch-country ripple">
            <input type="text" class="srchChannelField" id="srchChannelField" placeholder="{channelsTxtSearch}">
            <label for="srchChannelField" class="srch-icn"></label>
        </div>
        <div class="scrollable-container scroll-wrap channel-wrap">

            <div class="srchFavourites" id="channelsFavourites">
                <h4>{channelsTxtFavourites}</h4>
                <span class="fvrtText">{channelsTxtFavouritesHelpText}</span>
                <ul class="stngs-lang" id="channelsListFavourites"></ul>
            </div>
            <div class="allCountries">
                <h4>{channelsTxtCountries}</h4>
                <span class="cntryInfoTxt">{channelsTxtInfo}</span>
                <ul class="stngs-lang" id="channelsList">
                </ul>

                <div class="searchEmptyCont">
                  <span class="emptyTxtIcon"></span>
                  <h3 class="searchEmptyTxtHeading">{searchEmptyTxtHeading}</h3>
                  <p class="searchEmptyTxt">{searchEmptyTxtChannel}</p>
                  <div class="searchEmptyBtn">{searchEmptyBtnChannel}</div>
                </div>

                <div class="container" id="a"></div>
                <div class="modal" id="b" data-type="channel">
                  <div class="content">
                    <div class="requestHeader">{requestPopupTextChannel}</div>
                    <textarea cols="22" rows="5" placeholder="{requestPlaceholder}"></textarea>
                  </div>
                  <div class="footer">
                    <span class="cancelRequest">{skipBtn}</span>
                    <span class="submitRequest">{submitBtn}</span>
                  </div>
                </div>
            </div>
        </div>
    </div>
</div>
